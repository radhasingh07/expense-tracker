<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Expense Tracker</title>

<link rel="stylesheet"
href="style.css">

<link rel="preconnect"
href="https://fonts.googleapis.com">

<link rel="preconnect"
href="https://fonts.gstatic.com"
crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
rel="stylesheet">

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

</head>

<body>

<div class="background"></div>

<div class="container">

<h1>💰 Expense Tracker</h1>

<p class="subtitle">

Manage your money smartly.

</p>

<!-- Summary -->

<div class="summary">

<div class="card">

<h3>Balance</h3>

<h2 id="balance">

₹0

</h2>

</div>

<div class="card">

<h3>Income</h3>

<h2 id="income">

₹0

</h2>

</div>

<div class="card">

<h3>Expense</h3>

<h2 id="expense">

₹0

</h2>

</div>

</div>

<!-- Form -->

<div class="form">

<input
type="text"
id="description"
placeholder="Description">

<input
type="number"
id="amount"
placeholder="Amount">

<input
type="date"
id="date">

<select id="category">

<option>Food</option>

<option>Travel</option>

<option>Shopping</option>

<option>Bills</option>

<option>Entertainment</option>

<option>Salary</option>

<option>Other</option>

</select>

<select id="type">

<option value="income">

Income

</option>

<option value="expense">

Expense

</option>

</select>

<button id="addBtn">

➕ Add

</button>

</div>

<!-- Search -->

<input
type="text"
id="search"
placeholder="🔍 Search transactions">

<!-- Transaction List -->

<ul id="transactionList">

</ul>

<!-- Chart -->

<canvas id="expenseChart">

</canvas>

</div>

<script src="script.js"></script>

</body>

</html>
